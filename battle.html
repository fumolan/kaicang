<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ 实战OKX · 资金流失体验</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="battle.css?v=5">
</head>
<body>
  <header class="bt-topbar">
    <div class="bt-logo">⚔️ 实战</div>
    <button class="bt-start-btn" id="btStartBtn">🎯 监控入局</button>
    <button class="bt-radar-btn" id="btRadarBtn">📡 雷达</button>
    <nav class="bt-tabs">
      <button class="bt-tab active" data-pt="SPOT">现货</button>
      <button class="bt-tab" data-pt="SWAP">永续</button>
      <button class="bt-tab" data-pt="FUTURES">交割</button>
      <button class="bt-tab" data-pt="OPTION">期权</button>
    </nav>
    <span class="bt-status"><span class="bt-dot" id="btDot"></span><span id="btLast">--</span></span>
    <a class="bt-back" href="index.html">← 开仓</a>
  </header>

  <div class="coin-strip" id="btCoinStrip"><span class="bt-loading">加载中…</span></div>

  <main class="bt-main">
    <aside class="bt-side bt-long">
      <div class="bt-side-head">📈 做多 <span class="bt-tag">100U×10x</span></div>
      <div class="bt-curprice" id="btLongCurPrice">--</div>
      <div class="bt-entry" id="btLongEntry">等待</div>
      <div class="bt-pnl" id="btLongPnl">$0.00</div>
      <div class="bt-speed" id="btLongSpeed">--</div>
      <div class="bt-fundbar"><div class="bt-fundbar-fill" id="btLongFill"></div></div>
      <div class="bt-fundbar-label" id="btLongLabel">$100.00</div>
      <div class="bt-detail" id="btLongDetail"></div>
    </aside>

    <section class="bt-chart-col">
      <div class="card chart-card">
        <div class="card-title">📈 价格走势 <span class="bt-sub">4h·5min</span>
          <button class="bt-xray" id="btXrayPrice">🔍</button>
        </div>
        <div id="btPriceChart" class="chart-area"><span class="bt-loading">等待品种</span></div>
        <div class="chart-info" id="btPriceInfo"></div>
      </div>
    </section>

    <section class="bt-chart-col">
      <div class="card chart-card">
        <div class="card-title">📊 成交量·主动买 <span class="bt-sub">4h</span>
          <button class="bt-xray" id="btXrayVol">🔍</button>
        </div>
        <div id="btVolChart" class="chart-area"><span class="bt-loading">等待品种</span></div>
        <div class="chart-info" id="btVolInfo"></div>
      </div>
    </section>

    <aside class="bt-side bt-short">
      <div class="bt-side-head">📉 做空 <span class="bt-tag">100U×10x</span></div>
      <div class="bt-curprice" id="btShortCurPrice">--</div>
      <div class="bt-entry" id="btShortEntry">等待</div>
      <div class="bt-pnl" id="btShortPnl">$0.00</div>
      <div class="bt-speed" id="btShortSpeed">--</div>
      <div class="bt-fundbar"><div class="bt-fundbar-fill short" id="btShortFill"></div></div>
      <div class="bt-fundbar-label" id="btShortLabel">$100.00</div>
      <div class="bt-detail" id="btShortDetail"></div>
    </aside>
  </main>

  <div class="bt-total-funds">
    <span class="bt-total-label">💰 总资金</span>
    <div class="bt-total-bar"><div class="bt-total-fill" id="btTotalFill"></div></div>
    <span class="bt-total-val" id="btTotalVal">$200.00</span>
  </div>

  <!-- ⚙️ 策略参数 + 🧮 计算器(和开仓主页同款) -->
  <div class="bt-bottom-cards">
    <div class="card bt-trade-card">
      <div class="card-title">📋 模拟交易记录 <span class="bt-sub">IndexedDB持久化</span></div>
      <div class="bt-strat-btns">
        <button class="bt-dir-btn bt-dir-long active" id="btDirLong">📈 做多</button>
        <button class="bt-dir-btn bt-dir-short" id="btDirShort">📉 做空</button>
      </div>
      <div class="bt-strat-grid">
        <label>保证金(U)<input id="btMargin" type="number" value="100" min="10"></label>
        <label>杠杆<input id="btLev" type="number" value="10" min="1" max="125">x</label>
      </div>
      <div id="btStratPreview" class="bt-strat-preview"><span class="bt-loading">等待价格…</span></div>
      <button class="bt-open-btn" id="btOpenBtn">🚀 开仓</button>
      <div class="bt-sec-title">📌 持仓 <span class="bt-sub" id="btPosCount"></span></div>
      <div id="btOpenPositions" class="bt-pos-list"></div>
      <div class="bt-sec-title">📜 已完结 <span class="bt-sub" id="btHistStats"></span></div>
      <div id="btClosedTrades" class="bt-hist-list"></div>
    </div>
    <div class="card bt-calc-card">
      <div class="card-title">🧮 爆仓价 & 利润计算器 <span class="bt-sub" id="btCalcPrice">--</span></div>
      <div class="bt-calc-grid">
        <label>杠杆<input id="btCalcLev" type="number" value="10" min="1" max="125">x</label>
        <label>保证金<input id="btCalcMargin" type="number" value="100">U</label>
        <label>平仓价<input id="btCalcExit" type="number" step="any" placeholder="默认现价"></label>
        <label>维持保证金率<select id="btMmr"><option value="0.004">0.4%</option><option value="0.005" selected>0.5%</option><option value="0.01">1%</option></select></label>
      </div>
      <div class="bt-calc-tps">
        <div class="ctp long">
          <span class="ctp-h">📈 做多</span>
          <span>爆仓 <b id="btLiqLong" class="bt-red">--</b></span>
          <span>止损 <b id="btSlLong" class="bt-green">--</b></span>
          <span>止盈 <b id="btTpLong" class="bt-green">--</b></span>
          <button class="bt-mini-open long" id="btCalcOpenLong">开多</button>
        </div>
        <div class="ctp short">
          <span class="ctp-h">📉 做空</span>
          <span>爆仓 <b id="btLiqShort" class="bt-green">--</b></span>
          <span>止损 <b id="btSlShort" class="bt-red">--</b></span>
          <span>止盈 <b id="btTpShort" class="bt-green">--</b></span>
          <button class="bt-mini-open short" id="btCalcOpenShort">开空</button>
        </div>
      </div>
      <div class="bt-calc-results">
        <div><label>做多利润</label><b id="btPnlLong">--</b></div>
        <div><label>做空利润</label><b id="btPnlShort">--</b></div>
        <div><label>仓位≈</label><b id="btPosSize">--</b></div>
        <div><label>止盈赚</label><b id="btTpProfit" class="bt-green">--</b></div>
      </div>
      <div class="bt-sec-title">📌 持仓 <span class="bt-sub" id="btCalcPosCount"></span></div>
      <div id="btCalcPositions" class="bt-pos-list"></div>
      <div class="bt-sec-title">📜 记录 <span class="bt-sub" id="btCalcHistStats"></span></div>
      <div id="btCalcHistory" class="bt-hist-list"></div>
    </div>
  </div>
  </div>

  <!-- 雷达弹框 -->
  <div class="bt-radar-overlay hidden" id="btRadarOverlay">
    <div class="bt-radar-modal">
      <div class="bt-radar-head">
        <span>📡 加密雷达</span>
        <button class="bt-radar-close" id="btRadarClose">&times;</button>
      </div>
      <iframe class="bt-radar-frame" src="https://fumolan.github.io/crypto-radar/" loading="lazy"></iframe>
    </div>
  </div>

  <!-- 透视弹框 -->
  <div class="bt-xray-overlay hidden" id="btXrayOverlay">
    <div class="bt-xray-modal">
      <div class="bt-xray-head">
        <span>🔍 透视 <span id="btXrayTitle" class="bt-sub"></span></span>
        <button class="bt-xray-close" id="btXrayClose">&times;</button>
      </div>
      <div class="bt-xray-body">
        <div id="btXrayTrades" class="bt-xray-trades"><span class="bt-loading">加载中…</span></div>
      </div>
    </div>
  </div>

  <script src="battle.js?v=5"></script>
</body>
</html>
