<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="实战OKX — 现货/永续/交割/期权四品种模拟, 双向自动开仓100U×10x, 直观感受资金流失速度">
  <title>⚔️ 实战OKX · 资金流失体验</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="battle.css?v=20260916220541">
</head>
<body>
  <header class="bt-topbar">
    <div class="bt-logo">⚔️ 实战OKX</div>
    <div class="bt-motto">感受资金流失速度 · 100U×10x</div>
    <nav class="bt-tabs">
      <button class="bt-tab active" data-pt="SPOT">现货</button>
      <button class="bt-tab" data-pt="SWAP">永续</button>
      <button class="bt-tab" data-pt="FUTURES">交割</button>
      <button class="bt-tab" data-pt="OPTION">期权</button>
    </nav>
    <div class="bt-inst-strip" id="btInstStrip"></div>
    <span class="bt-status"><span class="bt-dot" id="btDot"></span><span id="btLast">--:--:--</span></span>
    <a class="bt-back" href="index.html">← 返回开仓</a>
  </header>

  <main class="bt-main">
    <!-- 左: 做多 -->
    <aside class="bt-side bt-long" id="btLongSide">
      <div class="bt-side-head">📈 做多 <span class="bt-tag">100U × 10x</span></div>
      <div class="bt-entry" id="btLongEntry">等待开仓</div>
      <div class="bt-pnl" id="btLongPnl">$0.00</div>
      <div class="bt-speed" id="btLongSpeed">-- /分钟</div>
      <div class="bt-fundbar-wrap">
        <div class="bt-fundbar" id="btLongBar"><div class="bt-fundbar-fill" id="btLongFill"></div></div>
        <div class="bt-fundbar-label" id="btLongLabel">$100.00 / 100%</div>
      </div>
      <div class="bt-detail" id="btLongDetail"></div>
    </aside>

    <!-- 中 -->
    <section class="bt-center">
      <div class="bt-chart-card">
        <div class="bt-card-title">📊 1小时K线 <span class="bt-sub" id="btChartNote"></span></div>
        <div id="btChart" class="bt-chart"><span class="bt-loading">选择品种开始</span></div>
      </div>
      <div class="bt-vol-card">
        <div class="bt-card-title">📋 逐笔成交 <span class="bt-sub" id="btVolNote"></span></div>
        <div id="btTrades" class="bt-trades"><span class="bt-loading">等待数据</span></div>
        <div id="btVolStats" class="bt-volstats"></div>
      </div>
    </section>

    <!-- 右: 做空 -->
    <aside class="bt-side bt-short" id="btShortSide">
      <div class="bt-side-head">📉 做空 <span class="bt-tag">100U × 10x</span></div>
      <div class="bt-entry" id="btShortEntry">等待开仓</div>
      <div class="bt-pnl" id="btShortPnl">$0.00</div>
      <div class="bt-speed" id="btShortSpeed">-- /分钟</div>
      <div class="bt-fundbar-wrap">
        <div class="bt-fundbar" id="btShortBar"><div class="bt-fundbar-fill short" id="btShortFill"></div></div>
        <div class="bt-fundbar-label" id="btShortLabel">$100.00 / 100%</div>
      </div>
      <div class="bt-detail" id="btShortDetail"></div>
    </aside>
  </main>

  <!-- 底部: 总资金条 -->
  <div class="bt-total-funds">
    <div class="bt-total-label">💰 总资金 (做多+做空)</div>
    <div class="bt-total-bar"><div class="bt-total-fill" id="btTotalFill"></div></div>
    <div class="bt-total-val" id="btTotalVal">$200.00</div>
  </div>

  <!-- 底部: 手动操作 -->
  <div class="bt-controls">
    <div class="bt-manual">
      <button class="bt-btn bt-btn-long" id="btManualLong">📈 手动做多</button>
      <input type="number" id="btManualAmount" value="100" min="10" title="保证金(U)" class="bt-input">
      <span class="bt-x">×</span>
      <input type="number" id="btManualLev" value="10" min="1" max="125" title="杠杆" class="bt-input bt-lev">
      <span class="bt-x">x</span>
      <button class="bt-btn bt-btn-short" id="btManualShort">📉 手动做空</button>
    </div>
  </div>

  <!-- 底部: 记录 -->
  <div class="bt-records">
    <div class="bt-card-title">📜 交易记录</div>
    <div id="btRecordList" class="bt-record-list"><span class="bt-loading">暂无记录</span></div>
  </div>

  <footer class="bt-footer">
    OKX实时数据 · 双向自动开仓100U×10x · 切换品种即自动重新开仓 · 交易记录存本地浏览器
  </footer>

  <script src="battle.js?v=20260916220541"></script>
</body>
</html>
